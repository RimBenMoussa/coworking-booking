# Application complète en local : PostgreSQL + API ASP.NET Core + frontend (Nginx).
#   cp .env.example .env      # puis remplir les valeurs (jamais commité)
#   docker compose up --build
# Application : http://localhost:8080 (port modifiable avec FRONTEND_PORT dans .env)
#
# Ordre de démarrage garanti par les healthchecks :
#   db sain (pg_isready)  ->  backend sain (/ready : base joignable)  ->  frontend

name: coworking-booking

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coworking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-coworking}
    volumes:
      - pgdata:/var/lib/postgresql/data   # les données survivent à "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Pas de port publié : seule l'API parle à la base, par le réseau interne de compose.

  backend:
    build: ./backend
    image: coworking-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # "db" = nom du service ci-dessus, résolu par le DNS interne de Docker.
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-coworking};Username=${POSTGRES_USER:-coworking};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?définir JWT_KEY dans .env (32 caractères minimum)}
      Admin__Email: ${ADMIN_EMAIL:?définir ADMIN_EMAIL dans .env}
      Admin__Password: ${ADMIN_PASSWORD:?définir ADMIN_PASSWORD dans .env}
      Frontend__Url: http://localhost:${FRONTEND_PORT:-8080}
      Database__MigrateOnStartup: "true"   # crée les tables et le seed au premier démarrage
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    ports:
      # Publié seulement sur la machine locale, pour Swagger et le débogage.
      # Le frontend, lui, passe par le réseau interne (Nginx -> backend:8080).
      - "127.0.0.1:${BACKEND_PORT:-5080}:8080"
    healthcheck:
      # /ready vérifie que PostgreSQL répond (voir Program.cs).
      test: ["CMD", "curl", "-fs", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  frontend:
    build: ./frontend
    image: coworking-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
